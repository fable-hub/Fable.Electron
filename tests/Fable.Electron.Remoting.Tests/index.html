<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Hello World!</title>

  </head>
  <body>
    <h1>💖 Hello World!</h1>
    <p>Welcome to your Electron application.</p>
    <h2 id="counter-text">0</h2>
    <button id="counter-button-increment">+</button>
    <button id="counter-button-decrement">-</button>
    <button id="counter-set-42">Set 42</button>
    <button id="counter-button-disable">disable</button>
    <button id="counter-button-enable" disabled="disabled">enable</button>
    <div style="display: flex; flex-direction: row; gap: 10px; margin: 10px 0px; border: 1px solid gray; padding: 10px;">
      <button id="window-logger-button">Log Window Id + String</button>
      <div id="window-logger-output">Placeholder</div>
    </div>
    <div style="display: flex; flex-direction: row; gap: 10px; margin: 10px 0px; border: 1px solid gray; padding: 10px;">
      <button id="window-logger-button-multiple-args">Log Window Id + String + Number + Boolean</button>
      <div id="window-logger-output-multiple-args">Placeholder</div>
    </div>
    <div style="display: flex; flex-direction: row; gap: 10px; margin: 10px 0px; border: 1px solid gray; padding: 10px;">
      <button id="window-logger-from-value-button-multiple-args">Log fromValue + String + Number + Boolean</button>
      <div id="window-logger-from-value-output-multiple-args">Placeholder</div>
    </div>
    <script type="module" src="/src/renderer.js"></script>
  </body>
</html>
